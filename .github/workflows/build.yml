name: Сборка выхода ТС

on:
  push:
    paths:
      - 'input/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: pip install openpyxl

      - name: LibreOffice (пересчёт формул свода, чтение старых .xls)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends libreoffice-calc

      - name: Собрать свод, data.json, drivers.json
        run: python scripts/build.py

      - name: Сохранить результат
        run: |
          git config user.name "robot"
          git config user.email "robot@users.noreply.github.com"
          git add -A -- . ':!.build_failed'
          git diff --cached --quiet || git commit -m "Авто: данные на $(date +%Y-%m-%d)"
          for i in 1 2 3 4 5; do          # пока шла сборка, могла прийти новая загрузка - подтягиваем и пробуем снова
            git pull --rebase -X theirs && git push && exit 0
            git rebase --abort 2>/dev/null || true
            sleep $((i*3))
          done
          exit 1

      - name: Если сборка не удалась - показать причину (красный крестик)
        run: |
          if [ -f .build_failed ]; then
            echo "::error::$(cat .build_failed)"
            exit 1
          fi

      - name: Копия на Bitbucket (сайт summary2889.bitbucket.io)
        run: git fetch --unshallow || true

      - name: Записать в Bitbucket
        env:
          BB_TOKEN: ${{ secrets.BITBUCKET_TOKEN }}
          BB_USER: aigulizimbergen@gmail.com
        run: |
          if [ -z "$BB_TOKEN" ]; then echo "::error::секрет BITBUCKET_TOKEN пустой или не создан"; exit 1; fi
          for U in x-bitbucket-api-token-auth "$BB_USER"; do
            [ -z "$U" ] && continue
            if out=$(git push --force "https://${U}:${BB_TOKEN}@bitbucket.org/summary2889/summary2889.bitbucket.io.git" HEAD:main 2>&1); then echo "ok: $U"; exit 0; fi
            echo "::warning::вход как ${U%%@*}: ${out//$BB_TOKEN/***}"
          done
          echo "::error::не удалось записать в Bitbucket"; exit 1

      - name: При ошибке очистить input/ (чтобы не мешали следующей загрузке)
        if: failure()
        run: |
          git config user.name "robot"
          git config user.email "robot@users.noreply.github.com"
          git rm -q --ignore-unmatch input/*.xlsx input/*.XLSX input/*.xlsm input/*.xls input/*.XLS || true
          git diff --cached --quiet || git commit -m "Авто: очистка input/ после ошибки"
          git pull --rebase || true
          git push || true

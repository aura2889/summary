name: Сборка выхода ТС

on:
  push:
    paths:
      - 'input/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: pip install openpyxl

      - name: Собрать data.json и drivers.json
        run: python scripts/build.py

      - name: Сохранить результат
        run: |
          git config user.name "robot"
          git config user.email "robot@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "Авто: данные на $(date +%Y-%m-%d)"
          git pull --rebase
          git push

      - name: При ошибке очистить input/ (чтобы не мешали следующей загрузке)
        if: failure()
        run: |
          git config user.name "robot"
          git config user.email "robot@users.noreply.github.com"
          git rm -q --ignore-unmatch input/*.xlsx input/*.XLSX input/*.xlsm || true
          git diff --cached --quiet || git commit -m "Авто: очистка input/ после ошибки"
          git pull --rebase || true
          git push || true

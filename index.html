<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f3d5e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Выход ТС">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Выход ТС</title>
<style>
:root{
  --bg:#f3f6f9; --card:#fff; --ink:#14212b; --muted:#667785; --line:#e1e8ee;
  --brand:#0f3d5e; --brand2:#1c6aa3; --day:#fff3cf; --day-ink:#6b4e00; --night:#1b2a3a; --night-ink:#dbe7f3;
  --ok:#1b7f4b; --bad:#c0392b; --soft:#eef3f8;
  --plan-bg:#ffd9a8; --plan-ink:#8a4300; --fact-bg:#bfe8cf; --fact-ink:#0f5b33;
  --blue-bg:#dcecfa; --blue-ink:#0f4f80; --blue-line:#b9d6ef;
}
@media (prefers-color-scheme:dark){
  :root{--bg:#0d1620; --card:#152330; --ink:#e8eff5; --muted:#8fa3b3; --line:#243747;
    --brand:#0f3d5e; --brand2:#4aa0dc; --day:#4a3c10; --day-ink:#ffe9a8; --night:#0a1118; --night-ink:#b9cde0;
    --ok:#4cc38a; --bad:#ff7b6b; --soft:#1b2d3d;
    --plan-bg:#6b3d0e; --plan-ink:#ffd9a8; --fact-bg:#17513a; --fact-ink:#b6f0d1;
    --blue-bg:#17344d; --blue-ink:#9fd0f5; --blue-line:#24506f}
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  padding-bottom:env(safe-area-inset-bottom)}
header{background:var(--brand);color:#fff;padding:calc(env(safe-area-inset-top) + 12px) 16px 14px;position:sticky;top:0;z-index:5}
.row{display:flex;align-items:center;justify-content:space-between;gap:8px}
h1{font-size:18px;margin:0;font-weight:700}
.date{font-size:13px;opacity:.85}
.date{display:flex;align-items:center;gap:4px}
.dbtn{font:inherit;font-size:14px;color:#fff;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.3);border-radius:8px;height:28px;padding:0 10px;cursor:pointer;white-space:nowrap}
.cal{position:fixed;z-index:30;width:min(290px,calc(100vw - 24px));background:var(--card);color:var(--ink);border:1px solid var(--blue-line);border-radius:14px;box-shadow:0 10px 30px rgba(8,30,50,.35);padding:10px}
.cal .ch{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
.cal .ch b{font-size:14px}
.cal .ch button{border:0;background:var(--blue-bg);color:var(--blue-ink);border-radius:8px;width:30px;height:30px;font-size:17px;cursor:pointer}
.cal .ch button:disabled{opacity:.3;cursor:default}
.cal .g{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;text-align:center}
.cal .w{font-size:11px;color:var(--muted);padding:2px 0}
.cal .d{height:34px;border:0;border-radius:9px;background:none;color:var(--muted);opacity:.45;font:inherit;font-size:14px}
.cal .d.on{opacity:1;background:var(--blue-bg);color:var(--blue-ink);font-weight:700;cursor:pointer}
.cal .d.cur{background:var(--brand);color:#fff}
.dnav{border:0;background:rgba(255,255,255,.14);color:#fff;border-radius:8px;width:28px;height:28px;font-size:18px;line-height:1;padding:0;cursor:pointer}
.dnav:disabled{opacity:.3;cursor:default}
.dnow{border:0;background:#fff;color:var(--brand);border-radius:8px;height:28px;padding:0 8px;font:inherit;font-size:12px;font-weight:700;cursor:pointer}
.arch{background:#fff3cd;color:#664d03;border-radius:10px;padding:6px 10px;margin:0 0 10px;font-size:13px}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-top:10px}
.kpi{background:rgba(255,255,255,.12);border-radius:10px;padding:7px 8px;text-align:center}
.kpi b{display:block;font-size:19px;line-height:1.1;white-space:nowrap}
.kpi:last-child b{font-size:15px;padding-top:3px}
.kpi span{font-size:11px;opacity:.8}
.kpi.neg b{color:#ffb4a8}
.kpis.k5{grid-template-columns:1fr 1fr 1fr .9fr 1.3fr;gap:6px}.kpis.k5 .kpi{padding:7px 4px}.kpi.sm b{font-size:15px;padding-top:3px;color:#ffe08a}
.kpi.sm span{font-size:10px;white-space:nowrap}
.tabs{display:flex;gap:6px;margin-top:10px}
.tab{flex:1;border:0;border-radius:9px;padding:8px 3px;font:inherit;font-size:12.5px;font-weight:600;line-height:1.15;background:rgba(255,255,255,.12);color:#fff}
.tab.wide{flex:1.2}
.tab.on{background:#fff;color:var(--brand)}
main{padding:12px 12px 40px;max-width:760px;margin:0 auto}
.search{width:100%;padding:11px 14px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit;margin-bottom:10px}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:8px;margin:0 -12px 6px;padding-left:12px;padding-right:12px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
@media (hover:hover) and (pointer:fine){.chips{margin:0 0 6px;padding:0 0 10px;scrollbar-width:thin}.chips::-webkit-scrollbar{display:block;height:8px}.chips::-webkit-scrollbar-thumb{background:var(--line);border-radius:4px}}
.chips.g4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));overflow:visible;margin:0 0 8px;padding:0}
.chips.g4 .chip{padding:8px 2px;font-size:13px;overflow-wrap:anywhere;text-align:center;white-space:normal;line-height:1.15;border-radius:14px;display:flex;flex-direction:column;align-items:center;justify-content:center}
.chips.g4 .chip small{margin:2px 0 0}
.drc{padding:8px 0;border-bottom:1px solid var(--line)}.drc:last-child{border:0}
.drc .ph a{margin-right:10px;font-weight:600}.drc .vs{margin-top:4px;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.chip{flex:none;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:7px 12px;font:inherit;font-weight:600;white-space:nowrap}
.chip small{color:var(--muted);font-weight:500;margin-left:4px}
.chip.on{background:var(--brand2);border-color:var(--brand2);color:#fff}
.chip.on small{color:#e7f2fb}
.seg{display:flex;background:var(--card);border:1px solid var(--line);border-radius:11px;padding:3px;margin:4px 0 12px}
.seg button{flex:1;border:0;background:none;color:var(--muted);border-radius:8px;padding:8px;font:inherit;font-weight:600}
.seg button.on{background:var(--brand2);color:#fff}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:10px}
.card h3{margin:0 0 8px;font-size:15px;display:flex;gap:6px;align-items:baseline;flex-wrap:wrap}
.card h3 em{font-style:normal;color:var(--muted);font-weight:500;font-size:14px}
.sec{margin:14px 2px 6px;font-size:12px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.04em}
.nums{display:flex;flex-wrap:wrap;gap:6px}
.v,.hit[data-i]{cursor:pointer}
.v{border-radius:8px;padding:5px 9px;font-weight:600;font-size:14px;font-variant-numeric:tabular-nums;border:1px solid transparent}
.v.vd{background:var(--day);color:var(--day-ink)}
.v.vn{background:var(--night);color:var(--night-ink)}
.v.vdn{background:var(--day);color:var(--day-ink);padding:0 0 0 9px;display:inline-flex;align-items:center;overflow:hidden}
.v.vdn::after{content:'+ночь';background:var(--night);color:var(--night-ink);padding:5px 7px;margin-left:8px;font-size:11px;font-weight:600}
.legend{display:flex;gap:12px;font-size:12px;color:var(--muted);margin:2px 2px 10px;flex-wrap:wrap}
.legend i{display:inline-block;width:12px;height:12px;border-radius:4px;vertical-align:-2px;margin-right:4px}
.depgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.dep{text-align:left;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:14px;padding:12px;font:inherit}
.dep b{display:block;font-size:16px}
.dep span{color:var(--muted);font-size:13px}
.dep .tot{font-size:24px;font-weight:700;color:var(--brand2);display:block;margin:2px 0}
.dep.hitdep{border-color:var(--brand2)}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{padding:8px 6px;border-bottom:1px solid var(--line);text-align:right;font-variant-numeric:tabular-nums}
th:first-child,td:first-child,th:nth-child(2),td:nth-child(2){text-align:left}
td.pref{color:var(--muted);font-size:12px;width:30px;padding-right:0}
th:nth-child(n+3),td:nth-child(n+3){white-space:nowrap}
.card table{font-size:13px}.card th,.card td{padding:8px 3px}
th{color:var(--muted);font-weight:600;font-size:12px}
td.neg,.neg{color:var(--bad);font-weight:600}td.pos,.pos{color:var(--ok);font-weight:600}
.empty{color:var(--muted);text-align:center;padding:30px 10px}
.hit{display:flex;justify-content:space-between;gap:8px;padding:8px 0;border-bottom:1px solid var(--line)}
.hit:last-child{border:0}
.hit small{color:var(--muted)}
#pop{position:absolute;z-index:20;width:max-content;max-width:min(290px,calc(100vw - 16px));background:var(--card);color:var(--ink);
  border:1px solid var(--line);border-radius:12px;padding:10px 12px;box-shadow:0 8px 26px rgba(0,0,0,.28);display:none}
#pop::after{content:'';position:absolute;left:var(--ax,20px);width:12px;height:12px;background:var(--card);border:1px solid var(--line);
  border-width:0 1px 1px 0;transform:translateX(-50%) rotate(45deg);bottom:-7px}
#pop.below::after{bottom:auto;top:-7px;border-width:1px 0 0 1px}
#pop .pn{font-weight:700;font-size:15px}
#pop .pm{color:var(--muted);font-size:12px;margin:1px 0 6px}
#pop .dr{font-size:15px;padding:3px 0}
#pop .dr+.dr{border-top:1px solid var(--line)}
#pop .dr a{color:var(--brand2);font-weight:600;text-decoration:none;margin-right:12px;white-space:nowrap}
#pop .no{color:var(--muted);font-size:14px}
#pop .pf{color:var(--muted);font-size:11px;margin-top:6px}
.foot{color:var(--muted);font-size:12px;text-align:center;margin-top:16px}
.tl{font-size:12px;color:var(--muted);font-weight:700;margin:10px 0 5px}.tl:first-of-type{margin-top:0}
.sum{display:flex;justify-content:space-between;gap:8px;align-items:baseline;flex-wrap:wrap}.sum b{font-size:17px}.sum span{color:var(--muted);font-size:13px}.src{color:var(--muted);font-size:11.5px;margin-top:4px}
/* режимный лист */
.stats{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-bottom:10px}
.stat{background:var(--soft);border-radius:9px;padding:6px 2px;text-align:center}
.stat b{display:block;font-size:17px;font-variant-numeric:tabular-nums}
.stat.plan{background:var(--plan-bg)}.stat.plan b,.stat.plan span{color:var(--plan-ink)}
.stat.fact{background:var(--fact-bg)}.stat.fact b,.stat.fact span{color:var(--fact-ink)}
.stat span{font-size:10.5px;color:var(--muted)}
.cells{display:grid;grid-template-columns:repeat(3,1fr);gap:5px}
.cell{background:var(--blue-bg);border:1px solid var(--blue-line);border-radius:8px;padding:3px 7px 4px;display:flex;flex-direction:column;min-width:0}
.cell small{color:var(--blue-ink);font-size:11.5px;font-weight:700;display:flex;justify-content:space-between;align-items:baseline;gap:4px;flex-wrap:wrap}
.cell small u{text-decoration:none;font-size:10.5px;font-weight:600;background:var(--card);color:var(--brand2);border-radius:5px;padding:0 4px}
.cell b{font-size:16px;line-height:1.2;font-variant-numeric:tabular-nums;white-space:nowrap}
.cc{padding:9px 11px;margin-bottom:8px}.cc h3{margin:0 0 6px;font-size:14px}.cc .stats{gap:4px;margin-bottom:6px}.cc .stat{padding:3px 2px}.cc .stat b{font-size:15px}.cc .stat span{font-size:10px}
.cell i{font-style:normal;font-size:12px;color:var(--muted)}
.cell i u{text-decoration:none;background:var(--card);border-radius:5px;padding:0 5px;margin-left:4px;color:var(--brand2);font-weight:600}
.lrow{display:flex;justify-content:space-between;align-items:baseline;gap:8px;padding:7px 0;border-bottom:1px solid var(--line)}
.lrow:last-child{border:0}
.pq{display:grid;grid-template-columns:repeat(10,minmax(0,1fr));gap:3px;margin:0 -2px 8px;padding:5px 2px;position:sticky;top:var(--hh,0px);z-index:4;background:var(--bg)}.pqb{border:1px solid var(--blue-line);background:var(--blue-bg);color:var(--blue-ink);border-radius:7px;padding:6px 0;font:inherit;font-weight:700;font-size:13px;cursor:pointer;font-variant-numeric:tabular-nums}.pqb:active{opacity:.7}
.cc.flash{box-shadow:0 0 0 2px var(--brand2)}
.tapc{cursor:pointer}.tapc:active{opacity:.7}
.ccv{padding:9px 0;border-bottom:1px solid var(--line)}.ccv:last-child{border:0}
.ccv .cp{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}.ccv .cp b{font-size:17px}.ccv .cp small{color:var(--muted)}.ccv .cs{font-size:11.5px;font-weight:700;border-radius:6px;padding:0 6px;background:var(--bg)}
.ccv .cd{margin-top:3px;font-size:14px}.ccv .cd a{margin-left:8px;white-space:nowrap}.ccv .cn{margin-top:3px;font-size:13px;color:var(--muted)}
.lrow b{font-size:17px;font-variant-numeric:tabular-nums;background:var(--blue-bg);color:var(--blue-ink);border-radius:8px;padding:1px 10px;min-width:38px;text-align:center}
.lrow i{font-style:normal;font-size:12px;color:var(--muted);margin-left:6px}
.lrow i u{text-decoration:none;background:var(--blue-bg);border-radius:5px;padding:0 5px;margin-left:4px;color:var(--brand2);font-weight:600}
/* вкладка НАЧ автоколонн */
.vr{padding:9px 0;border-bottom:1px solid var(--line)}.vr:last-child{border:0}
.vr .top{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.vr .pl{font-weight:700;font-size:15px;font-variant-numeric:tabular-nums;background:var(--soft);border-radius:8px;padding:2px 9px}
.vr .mk{color:var(--muted);font-size:13px;flex:1;min-width:0}
.vr .dd{margin-left:auto;font-size:12.5px;font-weight:700;border-radius:8px;padding:2px 8px;background:var(--soft);color:var(--ink);white-space:nowrap}
.vr .dd.w1{background:#fff3cd;color:#664d03}.vr .dd.w2{background:#ffd9a8;color:#8a4300}.vr .dd.w3{background:#f8c9c2;color:#8e1f12}
.vr .wk{margin-top:3px;font-size:14px}
.vr .ex{margin-top:3px;font-size:12.5px;color:var(--muted);display:flex;gap:4px 12px;flex-wrap:wrap}
.vr .ex b{color:var(--ink);font-weight:600}
.vr .tg{font-size:11px;font-weight:700;border-radius:6px;padding:1px 6px;background:var(--blue-bg);color:var(--blue-ink)}
.gh{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin:12px 0 2px;padding-top:8px;border-top:2px solid var(--line);font-size:12.5px;font-weight:700;color:var(--brand2);text-transform:uppercase;letter-spacing:.03em}
.gh:first-of-type{border-top:0;margin-top:0;padding-top:0}.gh small{color:var(--muted);text-transform:none;letter-spacing:0;font-weight:500;font-size:12px;text-align:right}
.chief{color:var(--muted);font-size:13px;margin:-4px 0 6px}
.rl{font-size:13px;margin-top:10px;padding:7px 10px;border-radius:10px;background:var(--soft)}.rl b{display:block;font-size:12px;color:var(--muted);margin-bottom:3px}
.rl .nums{gap:5px}.rl .nums span{background:var(--card);border:1px solid var(--line);border-radius:7px;padding:1px 7px;font-weight:600}
.pw{background:#fff3cd;color:#664d03;border-radius:10px;padding:6px 10px;margin:0 0 10px;font-size:13px}
.tot6{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;margin-bottom:10px}
.tot6 div{background:var(--blue-bg);border:1px solid var(--blue-line);border-radius:10px;padding:6px 2px;text-align:center}.tot6 b{display:block;font-size:19px;line-height:1.1;color:var(--blue-ink)}.tot6 span{font-size:10.5px;color:var(--blue-ink);opacity:.8}.tot6{margin-bottom:14px;padding-bottom:12px;border-bottom:2px solid var(--line)}
.ak-s{display:flex;gap:4px 8px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin:0 0 6px}.ak-s span{background:var(--soft);border-radius:6px;padding:0 6px}
.pfs{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:4px;margin-bottom:12px}
.pf{border:1px solid var(--blue-line);background:var(--blue-bg);color:var(--blue-ink);border-radius:8px;padding:5px 0;min-width:0;font:inherit;text-align:center;cursor:pointer}
.pf b{display:block;font-size:13.5px;line-height:1.15}.pf span{display:block;font-size:13px;font-weight:700;line-height:1.2;margin:2px 6px 0;background:var(--card);color:var(--brand2);border-radius:6px}.pf.on span{background:#fff}.pf.on{background:var(--brand2);border-color:var(--brand2);color:#fff}
@media (min-width:900px) and (hover:hover) and (pointer:fine){.pfs{grid-template-columns:repeat(12,minmax(0,1fr));gap:6px}}
.chip.st{border-color:#e0b400;background:#fff3cd;color:#664d03}.chip.st.on{background:var(--brand2);border-color:var(--brand2);color:#fff}
.updt{font-size:12px;color:var(--muted);padding:4px 2px 0}.updt.part{color:#9a6b00}.updt.re{color:var(--ink);font-weight:600;padding-top:2px}

.tapk{cursor:pointer}.tapk:active{background:rgba(255,255,255,.2)}
#dev{position:fixed;inset:0;z-index:60;background:rgba(6,18,30,.55);display:none;align-items:flex-end;justify-content:center}
#dev .sh{background:var(--card);color:var(--ink);width:100%;max-width:640px;max-height:88vh;border-radius:18px 18px 0 0;display:flex;flex-direction:column;box-shadow:0 -10px 30px rgba(0,0,0,.3)}
#dev .shh{padding:14px 16px 8px;display:flex;align-items:center;justify-content:space-between;gap:10px}
#dev .shh b{font-size:18px}#dev .shx{border:0;background:var(--bg);color:var(--ink);width:32px;height:32px;border-radius:16px;font-size:18px;cursor:pointer}
#dev .shs{padding:0 16px 8px}
#dev .shb{overflow:auto;padding:0 16px 22px;-webkit-overflow-scrolling:touch}
.dv-t{font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;margin:14px 0 4px}
.dv-r{display:flex;justify-content:space-between;align-items:baseline;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
.dv-r .n{font-weight:600}.dv-r small{display:block;color:var(--muted);font-weight:400;font-size:12px;margin-top:1px;line-height:1.35}
.dv-r .d{font-weight:800;white-space:nowrap}.dv-y{color:#c98400}@media (prefers-color-scheme:dark){.dv-y{color:#f2c94c}}.dv-neg{color:#d2452f}.dv-pos{color:#1d8a4e}.dv-z{color:var(--muted)}
.dv-sum{background:var(--bg);border-radius:10px;padding:9px 11px;margin:6px 0 2px;font-size:14px}
.dv-g{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:4px 0}.dv-g.c2{grid-template-columns:repeat(2,1fr)}
.dv-tl{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:7px 6px 6px;text-align:center;cursor:pointer;display:flex;flex-direction:column;justify-content:space-between;gap:2px;min-width:0}
.dv-tl .tt{font-size:12px;font-weight:600;line-height:1.25;overflow-wrap:anywhere}.dv-tl .tv{font-size:19px;font-weight:800;line-height:1.15;font-variant-numeric:tabular-nums}.dv-tl .ts{font-size:11px;color:var(--muted);line-height:1.3}
.dv-tl.on{border-color:var(--brand2);box-shadow:0 0 0 1px var(--brand2)}
.dv-pn{grid-column:1/-1;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:4px 11px}
.dv-pn .dv-r:last-child{border:0}
.dlbar{margin:0 0 10px;text-align:right}.dlbar a{display:inline-block;font-size:13px;font-weight:600;color:var(--brand2);text-decoration:none;border:1px solid var(--blue-line);background:var(--blue-bg);border-radius:9px;padding:5px 10px}
/* ---- только компьютер (широкий экран + мышь); телефон не затрагивается ---- */
@media (min-width:900px) and (hover:hover) and (pointer:fine){
  header{padding-left:max(24px,calc((100vw - 1180px)/2));padding-right:max(24px,calc((100vw - 1180px)/2))}
  h1{font-size:22px}
  .date{font-size:15px}.dbtn{height:34px;font-size:15px}.dnav,.dnow{height:34px}.dnav{width:34px}
  .kpi{padding:10px}.kpi b{font-size:26px}.kpi:last-child b{font-size:22px;padding-top:2px}.kpi span{font-size:13px}
  .tabs{gap:10px;margin-top:14px}
  .tab{padding:15px 10px;font-size:17px;border-radius:12px}
  main{max-width:1180px;padding:18px 0 48px}
  .seg{max-width:420px}
  .search{max-width:640px;font-size:16px;padding:13px 16px}
  .depgrid{grid-template-columns:repeat(4,minmax(0,1fr))}
  .cg{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 14px;align-items:start}
  .cc .cells{grid-template-columns:repeat(4,minmax(0,1fr))}
  .card table{max-width:900px}
  .v{font-size:15px;padding:6px 11px}
}

.prr{padding:8px 0;border-top:1px solid var(--line)}.prr:first-of-type{border-top:0}.prr[data-pa],.prr[data-pd]{cursor:pointer}
.prt{font-weight:600;font-size:14.5px}.prt small{color:var(--muted);font-weight:500}.prp{display:inline-block;min-width:30px;padding:0 6px;border-radius:6px;background:var(--soft);color:var(--brand2);font-weight:800;text-align:center}
.prn{display:flex;justify-content:space-between;align-items:baseline;gap:8px;color:var(--muted);font-size:13.5px}.prn b{font-size:17px;font-weight:800}.prn.big{font-size:14.5px;color:var(--ink)}
.prs{font-size:12.5px;color:var(--muted);margin-top:2px}
.pcs{display:flex;flex-wrap:wrap;gap:4px;margin-top:5px}.pcc{background:var(--soft);border-radius:999px;padding:2px 8px;font-size:12px}
.pcg{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}.pct.on{outline:2px solid var(--brand2)}.pct[data-pc]{cursor:pointer}.pct{background:var(--soft);border-radius:10px;padding:8px 4px;text-align:center}.pct span{display:block;font-size:16px}.pct b{display:block;font-size:20px;line-height:1.2}.pct small{font-size:11px;color:var(--muted)}
.prr2{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:6px}.prr2>div{background:var(--soft);border-radius:10px;padding:7px 10px}.prr2 small{display:block;font-size:11px;color:var(--muted)}.prr2 span{font-weight:700;margin-right:8px}
.pbar{height:5px;border-radius:3px;background:var(--soft);margin-top:5px}.pbar i{display:block;height:5px;border-radius:3px}.pbar i.n{background:var(--bad)}.pbar i.p{background:var(--ok)}
</style>
</head>
<body>
<header>
  <div class="row"><h1>Выход ТС</h1><div class="date" id="date">загрузка…</div></div>
  <div class="kpis" id="kpis"></div>
  <div class="tabs">
    <button class="tab on" data-top="all">Для всех</button>
    <button class="tab" data-top="cits">Для ЦИТС</button>
    <button class="tab wide" data-top="disp">Для ДТТ диспетчеров</button>
    <button class="tab wide" data-top="nach">Жөндеу ақпары</button>
    <button class="tab wide" data-top="prod">Өндіріс ақпары</button>
  </div>
</header>
<div id="pop" role="dialog" aria-live="polite"></div>
<main id="app"><div class="empty">Загрузка сводки…</div></main>

<script>
(function(){
  /* ---- статистика посещений (GoatCounter). Впишите свой код между кавычками, например 'kbm-tehnika' ---- */
  var GC_CODE='kbm-tehnika';
  if(GC_CODE){try{var gs=document.createElement('script');gs.async=true;gs.src='//gc.zgo.at/count.js';
    gs.setAttribute('data-goatcounter','https://'+GC_CODE+'.goatcounter.com/count');document.head.appendChild(gs)}catch(e){}}
  function track(p){try{if(window.goatcounter&&window.goatcounter.count)window.goatcounter.count({path:p,title:p,event:true})}catch(e){}}
  var searched=false;
  var DATA=null, DRV=null, DATES=null, curDay='', top='all', sub='deps', csub='type', dep=null, shift='d', q='', dq='', cdisp=0;
  // порядок типов техники внутри отдела (по префиксам); остальное — после, по количеству
  var ORDER=['35','35.1','35.2','31','28','30','63','29','22','23','22.1','34','47','46','49','62','27','50','53','13','13.1','20'];
  var LAT={A:'А',B:'В',C:'С',E:'Е',H:'Н',K:'К',M:'М',O:'О',P:'Р',T:'Т',X:'Х',Y:'У'};
  var $=function(s){return document.querySelector(s)};
  function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
  function store(k,v){try{if(v===undefined)return localStorage.getItem(k);localStorage.setItem(k,v)}catch(e){return null}}
  function fmtDate(iso){var p=iso.split('-');return p[2]+'.'+p[1]+'.'+p[0]}
  function norm(s){return String(s).toUpperCase().replace(/[A-Z]/g,function(c){return LAT[c]||c}).replace(/[\s\-_.]/g,'')}

  function base(){return curDay?'archive/'+curDay+'/':''}
  function loadDrivers(){
    DRV=null;
    fetch(base()+'drivers.json?'+Date.now(),{cache:'no-store'}).then(function(r){return r.ok?r.json():null}).then(function(d){DRV=d}).catch(function(){DRV=null});
  }
  var dtry=0;
  function loadDates(){
    fetch('archive/index.json?'+Date.now(),{cache:'no-store'}).then(function(r){if(!r.ok)throw 0;return r.json()}).then(function(d){
      if(d&&d.dates&&d.dates.length>0){DATES=d.dates;if(DATA)header()}
    }).catch(function(){if(++dtry<4)setTimeout(loadDates,3000*dtry)});
  }
  function load(){
    loadDrivers(); loadRepair();
    fetch(base()+'data.json?'+Date.now(),{cache:'no-store'}).then(function(r){return r.json()}).then(function(d){
      DATA=d; DATA.veh.forEach(function(v,i){v._i=i});
      var names=depList().map(function(x){return x.name});
      var h=decodeURIComponent((location.hash||'').replace(/^#dep=/,''));
      var saved=store('dep');
      dep=h&&names.indexOf(h)>-1?h:(saved&&names.indexOf(saved)>-1?saved:null);
      if(dep) fixShift();
      if(!window._opened){window._opened=1;track(dep?'открытие/свой отдел':'открытие/главный экран')}
      var sd=+store('disp'); cdisp=(DATA.disp&&sd>=0&&sd<DATA.disp.length)?sd:0;
      render();
    }).catch(function(){
      $('#app').innerHTML='<div class="empty">Не удалось загрузить данные.<br>Проверьте интернет и откройте снова.</div>';
    });
  }

  // отделы в порядке листа «Выход ТС», остальные — после, по количеству техники
  function depList(){
    var m={};
    DATA.veh.forEach(function(v){
      var o=m[v.dep]||(m[v.dep]={name:v.dep,d:0,n:0,cnt:0});
      o.d+=v.d;o.n+=v.n;o.cnt++;
    });
    var ord=DATA.depOrder||[];
    return Object.keys(m).map(function(k){return m[k]}).sort(function(a,b){
      var ia=ord.indexOf(a.name), ib=ord.indexOf(b.name);
      if(ia>-1&&ib>-1) return ia-ib;
      if(ia>-1) return -1;
      if(ib>-1) return 1;
      return b.cnt-a.cnt||a.name.localeCompare(b.name);
    });
  }
  function fixShift(){ // по умолчанию день; если днём техники нет — показать все
    shift='d';
    var has=DATA.veh.some(function(v){return v.dep===dep&&v.d});
    if(!has) shift='all';
  }

  function header(){
    var t=DATA.totals;
    var de=$('#date');
    if(DATES){
      var ix=DATES.indexOf(curDay||DATES[0]);
      de.innerHTML=(curDay?'<button class="dnow" data-dnow="1">Сегодня</button>':'')+
        '<button class="dnav" data-dnav="1" title="раньше"'+(ix>=DATES.length-1?' disabled':'')+'>‹</button>'+
        '<button class="dbtn" id="dsel" data-dopen="1">'+fmtDate(curDay||DATES[0])+' ▾</button>'+
        '<button class="dnav" data-dnav="-1" title="позже"'+(ix<=0?' disabled':'')+'>›</button>';
    }else de.textContent='на '+fmtDate(DATA.date);
    var tr=DATA.tr||0, dv=t.diff+tr;     // машины на обучении в выходе не считаем, но и в отклонение не включаем
    $('#kpis').className='kpis'+(tr?' k5':'');
    $('#kpis').innerHTML=
      '<div class="kpi"><b>'+t.plan+'</b><span>план</span></div>'+
      '<div class="kpi"><b>'+t.fact+'</b><span>факт</span></div>'+
      '<div class="kpi tapk'+(dv<0?' neg':'')+'" data-dev="1" role="button" tabindex="0"><b>'+(dv>0?'+':'')+dv+'</b><span>откл. ›</span></div>'+
      (tr?'<div class="kpi sm" data-dev="1" role="button" tabindex="0"><b>'+tr+'</b><span>в обучении</span></div>':'')+
      '<div class="kpi"><b>'+t.day+' / '+t.night+'</b><span>день / ночь</span></div>';
  }

  function numChip(v){
    var cls=v.d&&v.n?'vdn':(v.d?'vd':'vn');
    return '<span class="v '+cls+'" data-i="'+v._i+'">'+esc(v.num)+'</span>';
  }
  function legend(){
    return '<div class="legend"><span><i style="background:var(--day)"></i>день</span><span><i style="background:var(--night)"></i>ночь</span><span><i style="background:linear-gradient(90deg,var(--day) 50%,var(--night) 50%)"></i>день и ночь</span></div>';
  }
  function seg(attr,items,cur){
    return '<div class="seg">'+items.map(function(i){return '<button '+attr+'="'+i[0]+'" class="'+(cur===i[0]?'on':'')+'">'+i[1]+'</button>'}).join('')+'</div>';
  }

  /* ---------- Для всех ---------- */
  function viewAll(){
    var h=seg('data-sub',[['deps','Отделы'],['types','По типам']],sub);
    return h+(sub==='deps'?viewDeps():viewTypes());
  }

  function viewDeps(){
    return '<input class="search" id="q" type="search" inputmode="search" enterkeyhint="search" placeholder="Поиск: отдел, номер машины, тип техники или водитель" value="'+esc(q)+'"><div id="dres">'+depsBody()+'</div>';
  }
  function depsBody(){
    var list=depList(), html='';
    if(q.trim()) return viewSearch(q.trim(),list);
    html+='<div class="chips">';
    html+='<button class="chip'+(dep===null?' on':'')+'" data-dep="">Все</button>';
    list.forEach(function(x){
      html+='<button class="chip'+(dep===x.name?' on':'')+'" data-dep="'+esc(x.name)+'">'+esc(x.name)+'<small>'+x.cnt+'</small></button>';
    });
    html+='</div>';
    if(dep===null){
      html+='<div class="depgrid">';
      list.forEach(function(x){
        html+='<button class="dep" data-dep="'+esc(x.name)+'"><b>'+esc(x.name)+'</b><span class="tot">'+x.cnt+'</span><span>день '+x.d+' · ночь '+x.n+'</span></button>';
      });
      return html+'</div>';
    }
    var vs=DATA.veh.filter(function(v){return v.dep===dep});
    var dcount=vs.filter(function(v){return v.d}).length, ncount=vs.filter(function(v){return v.n}).length;
    html+=seg('data-shift',[['d','День ('+dcount+')'],['n','Ночь ('+ncount+')'],['all','Все ('+vs.length+')']],shift);
    var f=vs.filter(function(v){return shift==='all'||(shift==='d'?v.d:v.n)});
    if(!f.length) return html+'<div class="empty">В этой смене техники нет</div>';
    html+=legend();
    var g={},keys=[];
    f.forEach(function(v){var k=v.p;if(!g[k]){g[k]={p:v.p,t:v.t,a:[]};keys.push(k)}g[k].a.push(v)});
    function rank(k){var i=ORDER.indexOf(k);return i>-1?i:1000-g[k].a.length}
    keys.sort(function(a,b){return rank(a)-rank(b)});
    html+='<div class="cg">';
    keys.forEach(function(k){
      var x=g[k];
      x.a.sort(function(a,b){return a.num.localeCompare(b.num,'ru',{numeric:true})});
      html+='<div class="card"><h3>'+esc(x.t)+'<em>— '+x.a.length+' ед.</em></h3><div class="nums">'+x.a.map(numChip).join('')+'</div></div>';
    });
    return html+'</div>';
  }

  function driverHits(toks){
    if(!DRV||!DRV.map) return [];
    var byN={},out=[];
    DATA.veh.forEach(function(v){
      (DRV.map[v.num]||[]).forEach(function(d){
        var k=d.n.toLowerCase(), e=byN[k];
        if(!e){e=byN[k]={n:d.n,t:d.t,t2:d.t2,s:d.s,v:[]};out.push(e)}
        if(e.v.indexOf(v)<0) e.v.push(v);
      });
    });
    return out.filter(function(d){
      var words=d.n.toLowerCase().replace(/[^\wа-яёәғқңөұүіһ]+/g,' ').split(' '), digits=((d.t||'')+(d.t2||'')).replace(/\D/g,'');
      return toks.every(function(t){
        if(/^[\d+\-() ]{4,}$/.test(t)&&/\d{4}/.test(t.replace(/\D/g,'')) ) return digits.indexOf(t.replace(/\D/g,''))>-1;
        if(/\*|-$/.test(t)||t.length<2) return false;
        return words.some(function(w){return w.indexOf(t)===0});
      });
    }).sort(function(a,b){return a.n.localeCompare(b.n,'ru')});
  }
  function viewSearch(raw,list,byDisp){
    var s=raw.toLowerCase(), n=norm(raw), h='';
    var ds=(byDisp||/\*|-$/.test(raw))?[]:list.filter(function(x){return norm(x.name).indexOf(n)>-1});
    if(ds.length){
      h+='<div class="sec">Отделы</div><div class="depgrid">';
      ds.forEach(function(x){
        h+='<button class="dep hitdep" data-dep="'+esc(x.name)+'"><b>'+esc(x.name)+'</b><span class="tot">'+x.cnt+' ед.</span><span>день '+x.d+' · ночь '+x.n+'</span></button>';
      });
      h+='</div>';
    }
    var toks=s.split(/\s+/).filter(Boolean);
    function lnum(x){return String(x).toUpperCase().replace(/[A-Z]/g,function(c){return LAT[c]||c})}
    var f=DATA.veh.filter(function(v){
      var hay=(v.t+' '+v.dep).toLowerCase(), nn=norm(v.num), ln=lnum(v.num);   // номер сравниваем без различия H/Н, A/А и т.п.
      return toks.every(function(t){
        if(/\*|-$/.test(t)){   // «49-» или «49-*» — все номера с этим префиксом
          var re=lnum(t).replace(/[.+?^${}()|[\]\\]/g,'\\$&').replace(/\*/g,'.*');
          try{return new RegExp('^'+re).test(ln)}catch(e){return false}
        }
        return hay.indexOf(t)>-1||nn.indexOf(norm(t))>-1});
    });
    var drs=driverHits(toks);
    if(f.length){
      h+='<div class="sec">Техника'+(f.length>60?' (первые 60 из '+f.length+')':'')+'</div><div class="card">';
      f.slice(0,60).forEach(function(v){
        var sh=v.d&&v.n?'день+ночь':(v.d?'день':'ночь');
        h+='<div class="hit" data-i="'+v._i+'"><div><b>'+esc(v.num)+'</b><br><small>'+esc(v.t)+'</small></div><div style="text-align:right"><b>'+esc(v.dep)+'</b><br><small>'+(byDisp&&DATA.disp&&DATA.disp[v.g]?esc(DATA.disp[v.g].name)+' · ':'')+sh+'</small></div></div>';
      });
      h+='</div>';
    }
    if(drs.length){
      h+='<div class="sec">Водители'+(drs.length>40?' (первые 40 из '+drs.length+')':'')+'</div><div class="card">';
      drs.slice(0,40).forEach(function(d){
        h+='<div class="drc"><b>'+esc(d.n)+'</b>'+(d.t||d.t2?'<div class="ph">'+(d.t?tel(d.t):'')+(d.t2?tel(d.t2):'')+(d.s?' <small style="opacity:.6">(общий номер)</small>':'')+'</div>':'<div class="ph"><small style="opacity:.6">номер не найден</small></div>')+
          '<div class="vs">'+d.v.map(function(v){return numChip(v)+'<small>'+esc(v.t)+' · '+esc(v.dep)+'</small>'}).join(' ')+'</div></div>';
      });
      h+='</div>';
    }
    return h||'<div class="empty">Ничего не найдено</div>';
  }

  function viewTypes(){
    var h='<div class="card"><table><tr><th>Преф.</th><th>Тип</th><th>План</th><th>Факт</th><th>Откл.</th><th>Д/Н</th></tr>';
    DATA.types.slice().sort(function(a,b){return b.plan-a.plan}).forEach(function(t){
      if(!t.plan&&!t.fact) return;
      h+='<tr><td class="pref">'+esc(t.p)+'</td><td>'+esc(t.name)+'</td><td>'+t.plan+'</td><td>'+t.fact+'</td><td class="'+(t.diff<0?'neg':(t.diff>0?'pos':''))+'">'+(t.diff>0?'+':'')+t.diff+'</td><td>'+t.day+'/'+t.night+'</td></tr>';
    });
    var T=DATA.totals;
    h+='<tr><td></td><td><b>Итого</b></td><td><b>'+T.plan+'</b></td><td><b>'+T.fact+'</b></td><td class="'+(T.diff<0?'neg':'pos')+'"><b>'+T.diff+'</b></td><td><b>'+T.day+'/'+T.night+'</b></td></tr></table></div>';
    return h;
  }

  /* ---------- Для ЦИТС: режимный лист (лист «Ежедневная сводка», I3:AD23) ---------- */
  var PBYN={'ППУ':'34','Экскаватор':'47','Вакуум уст.':'49','Автокран':'28','ТРАЛ':'22','АРОК (КМУ)':'27','ЦА-320':'31','АЦН':'35','Бульдозер':'50','Погрузчик':'53'};   // запасной вариант для старых дней
  function sign(n){return (n>0?'+':'')+n}
  function cellExtra(c){
    var s='';
    if(c.e) s+=c.e;
    if(c.u) s+=(s?' ':'')+'<u>утт '+c.u+'</u>';
    return s;
  }
  function viewCits(){
    var D=DATA.daily; if(!D||!D.rows.length) return '<div class="empty">Нет данных режимного листа</div>';
    var h=seg('data-csub',[['type','По технике'],['dep','По отделам']],csub);
    if(csub==='type'){
      h+='<div class="pq">'+D.rows.map(function(r,ri){return '<button class="pqb" data-cgo="'+ri+'">'+esc(r.p||PBYN[r.name]||'?')+'</button>'}).join('')+'</div>';
      h+='<div class="cg">';
      D.rows.forEach(function(r,ri){
        var keys=D.deps.filter(function(d){return r.cells[d]});
        h+='<div class="card cc" id="cc-'+ri+'"><h3>'+esc(r.name)+'</h3><div class="stats">'+
          '<div class="stat plan"><b>'+r.plan+'</b><span>план</span></div>'+
          '<div class="stat fact"><b>'+r.fact+'</b><span>факт</span></div>'+
          '<div class="stat"><b class="'+(r.diff<0?'neg':(r.diff>0?'pos':''))+'">'+sign(r.diff)+'</b><span>откл.</span></div>'+
          '<div class="stat"><b>'+r.day+'</b><span>день</span></div>'+
          '<div class="stat"><b>'+r.night+'</b><span>ночь</span></div></div>';
        if(keys.length){
          h+='<div class="cells">'+keys.map(function(d){
            var c=r.cells[d];
            return '<div class="cell tapc" data-cc="'+ri+'|'+esc(d)+'" role="button" tabindex="0"><small>'+esc(d)+(c.u?'<u>утт '+c.u+'</u>':'')+'</small><b>'+(c.e?c.e+'='+c.v:c.v)+'</b></div>';
          }).join('')+'</div>';
        }else h+='<div class="empty" style="padding:6px">Не распределено по отделам</div>';
        h+='</div>';
      });
      h+='</div>';
    }else{
      h+='<div class="cg">';
      D.deps.forEach(function(d){
        var items=D.rows.filter(function(r){return r.cells[d]});
        if(!items.length) return;
        var sum=items.reduce(function(a,r){return a+r.cells[d].v},0);
        h+='<div class="card"><h3>'+esc(d)+'<em>— '+sum+' ед.</em></h3>'+items.map(function(r){
          var c=r.cells[d],ex=cellExtra(c);
          return '<div class="lrow tapc" data-cc="'+D.rows.indexOf(r)+'|'+esc(d)+'" role="button" tabindex="0"><span>'+esc(r.name)+(ex?'<i>'+ex+'</i>':'')+'</span><b>'+c.v+'</b></div>';
        }).join('')+'</div>';
      });
      h+='</div>';
    }
    return h;
  }

  /* ---------- Для ДТТ диспетчеров ---------- */
  function viewDisp(){
    var D=DATA.disp||[]; if(!D.length) return '<div class="empty">Нет данных по диспетчерам</div>';
    return '<input class="search" id="dq" type="search" inputmode="search" enterkeyhint="search" placeholder="Поиск: номер машины, тип техники, отдел или водитель" value="'+esc(dq)+'"><div id="dbody">'+dispBody()+'</div>';
  }
  function dispBody(){
    var D=DATA.disp||[]; if(dq.trim()) return viewSearch(dq.trim(),[],true);
    if(cdisp<0||cdisp>=D.length) cdisp=0;
    var cnt=D.map(function(x,i){return DATA.veh.filter(function(v){return v.g===i}).length});
    var h='<div class="chips g4">'+D.map(function(x,i){
      var sp=(i===D.length-1&&4-(D.length-1)%4>1)?' style="grid-column:span '+(4-(D.length-1)%4)+'"':'';
      return '<button class="chip'+(cdisp===i?' on':'')+((DATA.stale&&DATA.stale[x.name])||(DATA.absent&&DATA.absent.indexOf(x.name)>-1)?' st':'')+'"'+sp+' data-disp="'+i+'">'+esc(x.name)+'<small>'+cnt[i]+'</small></button>';

    var tl=t.closest('[data-dvt]');
    if(tl){
      var ky=tl.dataset.dvt.split('|'), id=ky[0], i=+ky[1], det=(DVP[id]||[])[i], g=tl.parentNode;
      var was=tl.classList.contains('on'), old=g.querySelector('.dv-pn'); if(old) old.remove();
      g.querySelectorAll('.dv-tl.on').forEach(function(x){x.classList.remove('on')});
      if(det&&!was){
        var cols=g.classList.contains('c2')?2:3, tiles=g.querySelectorAll('.dv-tl'), end=Math.min(tiles.length,Math.ceil((i+1)/cols)*cols);
        var pn=document.createElement('div'); pn.className='dv-pn'; pn.innerHTML=det;
        g.insertBefore(pn,tiles[end]||null); tl.classList.add('on');
        try{pn.scrollIntoView({block:'nearest',behavior:'smooth'})}catch(_){}
      }
    }
  });
  // ---- «Для ЦИТС»: нажатие на ячейку (отдел × тип техники) - какие именно машины и водители
  function ccOpen(key){
    var i=key.indexOf('|'), r=DATA.daily.rows[+key.slice(0,i)], d=key.slice(i+1); if(!r) return;
    var pp=r.p||PBYN[r.name], vs=DATA.veh.filter(function(v){return v.dep===d&&v.p===pp});
    var c=r.cells[d]||{}, el=devShell(), h='';
    h+='<div class="sh"><div class="shh"><b>'+esc(r.name)+' · '+esc(d)+'</b><button class="shx" data-devx="1" aria-label="Закрыть">×</button></div>'+
       '<div class="shs"><small style="color:var(--muted)">'+vs.length+' ед.'+(c.e?' ('+esc(c.e)+')':'')+'</small></div><div class="shb">';
    if(!vs.length) h+='<div class="empty">Нет данных по машинам</div>';
    vs.forEach(function(v){
      var sh=v.d&&v.n?'день + ночь':(v.d?'день':'ночь'), cls=v.d&&v.n?'vdn':(v.d?'vd':'vn');
      h+='<div class="ccv"><div class="cp"><span class="v '+cls+'">'+esc(v.num)+'</span><small>'+esc(v.t)+' · '+sh+'</small></div>';
      var list=DRV&&DRV.map?DRV.map[v.num]:undefined;
      if(!DRV) h+='<div class="cn">Данные по водителям не загружены</div>';
      else if(list===undefined) h+='<div class="cn">Водитель не найден (номера нет в экспорте путевых листов)</div>';
      else if(!list.length) h+='<div class="cn">Водитель не указан (в экспорте без водителя)</div>';
      else list.forEach(function(x){h+='<div class="cd"><b>'+esc(x.n)+'</b>'+(x.t?tel(x.t)+(x.t2?tel(x.t2):''):'')+(x.s?' <small style="opacity:.6">(общий номер)</small>':'')+'</div>'});
      h+='</div>';
    });
    if(DRV&&DRV.date) h+='<div class="cn" style="padding-top:8px">по путевым листам на '+fmtDate(DRV.date)+'</div>';
    h+='</div></div>';
    el.innerHTML=h; el.style.display='flex'; document.body.style.overflow='hidden';
  }
  function setHH(){var h=document.querySelector('header');if(h)document.documentElement.style.setProperty('--hh',Math.round(h.getBoundingClientRect().height)+'px')}
  setHH(); window.addEventListener('resize',setHH); window.addEventListener('load',setHH);
  new MutationObserver(setHH).observe(document.querySelector('header'),{childList:true,subtree:true,attributes:true});
  document.addEventListener('click',function(e){
    var g=e.target.closest&&e.target.closest('[data-cgo]');
    if(g){
      var el=document.getElementById('cc-'+g.dataset.cgo); if(!el) return;
      var pq=document.querySelector('.pq'), hh=document.querySelector('header').getBoundingClientRect().height+(pq?pq.getBoundingClientRect().height:0);
      window.scrollTo({top:el.getBoundingClientRect().top+window.pageYOffset-hh-8,behavior:'smooth'});
      document.querySelectorAll('.cc.flash').forEach(function(x){x.classList.remove('flash')});
      el.classList.add('flash'); setTimeout(function(){el.classList.remove('flash')},1600);
      track('ЦИТС/префикс'); return;
    }
    var c=e.target.closest&&e.target.closest('[data-cc]');
    if(c&&DATA&&DATA.daily){track('ЦИТС/ячейка');ccOpen(c.dataset.cc)}
  });
  document.addEventListener('keydown',function(e){if((e.key==='Enter'||e.key===' ')&&e.target.dataset&&e.target.dataset.cc&&DATA&&DATA.daily){e.preventDefault();ccOpen(e.target.dataset.cc)}});
  document.addEventListener('keydown',function(e){if(e.key==='Escape')devClose();if((e.key==='Enter'||e.key===' ')&&e.target.dataset&&e.target.dataset.dev){e.preventDefault();devOpen('plan')}});
  var calM=null;
  function closeCal(){var c=document.querySelector('.cal');if(c)c.remove()}
  function openCal(){
    closeCal(); if(!DATES) return;
    var cd=curDay||DATES[0]; if(!calM) calM=cd.slice(0,7);
    var minM=DATES[DATES.length-1].slice(0,7), maxM=DATES[0].slice(0,7);
    var y=+calM.slice(0,4), m=+calM.slice(5,7), first=new Date(y,m-1,1), dim=new Date(y,m,0).getDate(), off=(first.getDay()+6)%7;
    var MN=['Январь','Февраль','Март','Апрель','Май','Июнь','Июль','Август','Сентябрь','Октябрь','Ноябрь','Декабрь'];
    var s='<div class="ch"><button data-cm="-1"'+(calM<=minM?' disabled':'')+'>‹</button><b>'+MN[m-1]+' '+y+'</b><button data-cm="1"'+(calM>=maxM?' disabled':'')+'>›</button></div><div class="g">';
    ['Пн','Вт','Ср','Чт','Пт','Сб','Вс'].forEach(function(w){s+='<div class="w">'+w+'</div>'});
    for(var i=0;i<off;i++) s+='<div></div>';
    for(var d=1;d<=dim;d++){
      var iso=calM+'-'+(d<10?'0':'')+d, has=DATES.indexOf(iso)>=0;
      s+='<button class="d'+(has?' on':'')+(iso===cd?' cur':'')+'"'+(has?' data-cd="'+iso+'"':' disabled')+'>'+d+'</button>';
    }
    var c=document.createElement('div'); c.className='cal'; c.innerHTML=s+'</div>';
    document.body.appendChild(c);
    var b=$('#dsel').getBoundingClientRect(); c.style.top=(b.bottom+6)+'px';
    c.style.left=Math.max(12,Math.min(window.innerWidth-c.offsetWidth-12,b.right-c.offsetWidth))+'px';
  }
  document.addEventListener('click',function(e){
    var t=e.target;
    if(t.closest('[data-dopen]')){ if(document.querySelector('.cal')) closeCal(); else {calM=null;openCal()} return }
    var cm=t.closest('[data-cm]');
    if(cm){var y=+calM.slice(0,4),m=+calM.slice(5,7)+(+cm.dataset.cm); if(m<1){m=12;y--} if(m>12){m=1;y++} calM=y+'-'+(m<10?'0':'')+m; openCal(); return}
    var cdb=t.closest('[data-cd]'); if(cdb){closeCal();goDay(cdb.dataset.cd);return}
    if(!t.closest('.cal')) closeCal();
  });
  document.addEventListener('keydown',function(e){if(e.key==='Escape')closeCal()});
  document.addEventListener('click',function(e){
    var b=e.target.closest('[data-dnav],[data-dnow]'); if(!b||!DATES) return;
    if(b.dataset.dnow) return goDay(DATES[0]);
    var ix=DATES.indexOf(curDay||DATES[0])+(+b.dataset.dnav);
    if(ix>=0&&ix<DATES.length) goDay(DATES[ix]);
  });
  load(); loadDates();
})();
</script>
</body>
